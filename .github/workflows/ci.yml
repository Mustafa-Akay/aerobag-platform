name: ci

on:
  push:
  pull_request:

jobs:
  dotnet:
    # Entegrasyon testleri Testcontainers ile Docker kullanır; ubuntu-latest üzerinde Docker hazırdır.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build --configuration Release
      - run: dotnet test --configuration Release --no-build

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/aerobag-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/aerobag-ui/package-lock.json
      - run: npm ci
      - run: npm run build

  ml:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
