services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aerobag
      POSTGRES_PASSWORD: aerobag_dev
      POSTGRES_DB: aerobag
    ports:
      - "5433:5432"   # 5433: bilgisayarındaki olası yerel Postgres ile çakışmasın
    # Şemayı göç aracı kurar: dotnet run --project src\AeroBag.Core\AeroBag.Migrator (db/migrations).
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aerobag -d aerobag"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ML tahmin servisi (Faz 2). Yalnizca yerel makineye acik; kimlik dogrulamasi yok, internete acilmamali.
  ml:
    build: ./ml
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
